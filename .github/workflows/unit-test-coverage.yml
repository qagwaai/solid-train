name: Unit Test Coverage

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce repository unit coverage
        shell: bash
        run: npm run test:coverage 2>&1 | tee unit-coverage.txt

      - name: Enforce core exoplanet coverage
        if: ${{ !cancelled() }}
        shell: bash
        run: npm run test:coverage:exoplanet 2>&1 | tee exoplanet-coverage.txt

      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-coverage
          path: |
            unit-coverage.txt
            unit-coverage.lcov
            exoplanet-coverage.txt
            exoplanet-coverage.lcov
          if-no-files-found: error
