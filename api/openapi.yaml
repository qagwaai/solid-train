openapi: 3.1.0
info:
  title: Stellar API and Message Contract
  version: 4.0.0
  description: >
    Machine-readable contract for HTTP endpoints and Socket.IO message payloads.
    Socket operations are modeled as virtual POST operations under /socket/* so the
    contract can be consumed by tooling that expects OpenAPI.
    Pre-release 4.0.0 celestial clarification: canonical bodies require bodyType,
    surfaceArchetype, explicit state, spatial and observability. Stellar source
    fields, shared orbital elements, and physical provenance/selection semantics
    are documented in the Celestial and SolarSystem modules and
    docs/celestial-body-contract.md. Catalog positions are seed-time snapshots.
    Spatial payloads use api/schemas/spatial-state.schema.json; barycentric labels
    do not identify a physical axis orientation or guarantee producer normalization.
    Station snapshot fix: canonical anchor lookup (Luna is sol-luna; station identity
    remains sol-moon-orbit), host-position translation and host snapshot epoch.
    Approved station hosts: ac-proxima-station uses alpha-centauri-star-tertiary;
    bs-main-station uses the generated barnards-star-planet-1.
    Unresolved station anchors fail explicitly; existing worlds require approved
    market seed repair, not automatic read-time persistence.

    Market contract explicit notes (3.1.2):
    - `/socket/market-buy` supports canonical cargo purchases and seeded ship listing purchases.
    - Seeded ship purchases require `quantity: 1` and return `transaction.purchasedShip` metadata.
    - Seeded ship purchases create a new owned ship with bundled starter inventory.

    Credit ledger contract (4.0.0): typed movements with stable IDs, authoritative
    full-scope balance, explicit scope/filter/paging rules and typed failures.
    See the Ledger module for socket event names and examples.
