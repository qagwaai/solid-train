paths:
  /socket/solar-system-get:
    post:
      summary: solar-system-get-request
      description: |
        Resolves a solar system by id, seeds its canonical celestial bodies on demand,
        and returns both the system summary and its materialized bodies.
        Positions are persisted seed-time barycentric snapshots at spatial.epochMs,
        not recalculated on each read. Orbital elements retain their reference epoch.
        Each body requires non-null bodyType and compatible surfaceArchetype.
        Per-body spectralClass and luminositySolar include companion stars; unknown
        source data is null. Visualization color is optional and independent.
        physicalCatalog and physical are separate provenance objects; see the shared
        physical schemas and docs/celestial-body-contract.md for units and precedence.
        Reads do not synthesize asteroid catalogs from physical estimates, overwrite
        source catalogs, coerce mission bodyType, or inject visualization defaults.
        Bodies preserve optional catalogIdentity; see the authoritative root
        x-catalog-identity registry, validation, data recreation and fallback rules.
        id remains game identity; only catalogIdentity identifies a real astronomical
        body for a frontend-owned texture catalog. textureKey is not that identity.

        Preconditions:
        - Every request must include a client-generated `correlationId` (UUID v4).
        - Every request must include `requestIdentity` with `operation`, `entityType`, and
          `containerId`.

        Response notes:
        - `solarSystem`, `stars`, and `bodies` are present on success.
        - Celestial body `id` values are durable canonical identity and may seed client-side appearance generation.
        - Every body includes a required `surfaceArchetype`; this is separate from `planetType`.
        - Mission-generated asteroids are normalized into canonical asteroid viewer shape.
        - Failure responses omit `solarSystem`, `stars`, and `bodies`.
      operationId: socketSolarSystemGet
      tags: [SolarSystem]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolarSystemGetRequest'
            examples:
              getSystem:
                summary: Retrieve a solar system snapshot with correlation metadata
                value:
                  playerName: PilotOne
                  sessionKey: session-123
                  correlationId: 36ea198f-0df8-4fa9-82b3-7bdfe0d9fd66
                  requestIdentity:
                    operation: solar-system-get
                    entityType: solar-system
                    containerId: alpha-centauri
                  solarSystemId: alpha-centauri
      responses:
        '200':
          description: solar-system-get-response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolarSystemGetResponse'
