  /socket/solar-system-list:
    post:
      summary: solar-system-list-request
      description: |
        Returns one page of solar systems from the registry, optionally filtered by
        source (`curated`, `procedural`, `exoplanet-catalog`), search text (matches
        `displayName`, `settlementName`, `aliases`, `id`, `catalogName`, and primary
        star proper name/spectral type),
        `minDistanceParsec` /
        `maxDistanceParsec`, `minPlanetCount` (1 = has planets), and primary-star
        `spectralClass`.

        Search is a literal substring match and accepts any non-whitespace length,
        including one- and two-character queries. Matching normalizes both query
        and labels to NFC, collapses whitespace, and applies English-locale case
        conversion; it preserves accents and does not transliterate or fold scripts.
        Regex metacharacters are treated literally.

        Paging (P2, breaking): results are always paged. `offset` defaults to 0 and
        `limit` defaults to 100; values above 500 are clamped to 500. Invalid paging
        values fail. Success responses include `total` (matches before paging),
        the effective `offset` and `limit`, and `hasMore`. Request the next page with
        `offset + limit` until `hasMore` is false.

        Preconditions:
        - Every request must include a client-generated `correlationId` (UUID v4).
        - Every request must include `requestIdentity` with `operation`, `entityType`, and
          `containerId`.

        Response notes:
        - `displayName` is the authoritative combined label; when naming is approved
          and enabled it is `Settlement Name (Original Catalog Designation)`.
          `settlementName` is nullable and contains only the bare assigned name.
          `aliases` contains searchable historical/source labels and is always an
          array. At present no new settlement assignments are enabled, so
          `settlementName` is null and existing display labels are unchanged.
        - Alias searches return all matching systems; exact `id` remains the only
          canonical get/navigation key. Search covers displayName, settlementName,
          aliases, catalogName and primary-star proper name.
        - `sort: distance` (default) orders by increasing distance, unknown distances
          last, then `id`. `sort: name` orders by `displayName` (case- and
          accent-insensitive, numeric-aware), then `id`.
        - Enrichment counts are computed only for the returned page.
        - Optional count fields such as `planetCount`, `moonCount`, `asteroidCount`,
          and `marketCount` are included when enrichment succeeds. Planet and moon
          counts come from the catalog registry; asteroid counts are the larger of the
          catalog and live counts; market counts are live.
        - Failure responses return an empty `solarSystems` array.
      operationId: socketSolarSystemList
