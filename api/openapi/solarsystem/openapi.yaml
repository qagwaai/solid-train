openapi: 3.1.0
info:
  title: Stellar API - SolarSystem
  version: 4.0.0
servers:
  - url: http://localhost:3000
tags:
  - name: SolarSystem
paths:
  /socket/navigation-route-estimate:
    post:
      summary: navigation-route-estimate-request
      operationId: socketNavigationRouteEstimate
      tags: [SolarSystem]
      description: |
        Isolated read-only direct baseline. Socket events are
        navigation-route-estimate-request and navigation-route-estimate-response.
        Requires the existing authenticated owned-ship lineage, verified Sol
        source/basis/epoch and exact bundled station gates. Does not seed, repair,
        persist positions or refresh presence. Existing geometric preview is unchanged.
        Request identity must name this operation, entityType solar-system and
        containerId exactly equal to solarSystemId. UUID v4 correlationId is echoed
        exactly; discard responses for stale correlations or selections.
        Measures straight-line Euclidean coordinate distanceKm between frozen
        evaluated endpoints in the named basis at the unchanged stored ship epoch.
        Not flown distance, a reachable route, candidate/curve length or clearance.
        Optional finite positive scenarioCruiseSpeedKmPerSec yields distance/speed
        in seconds: a hypothetical frozen-endpoint constant-speed estimate, NOT an
        ETA. No acceleration, braking, assist speed changes or movement during the
        trip is modeled. No default speed, driveProfile lookup or ship-capability
        inference. Omitted speed leaves duration unavailable with
        SCENARIO_SPEED_NOT_SUPPLIED; invalid speed rejects the operation.
        Supported means distance available, with independent duration status.
        Invalid, unsupported, ineligible and failed outcomes carry reasons/messages,
        never distance/duration. Known source/destination host-profile intersections
        block estimation; otherwise CLEARANCE_UNVERIFIED remains mandatory.
        Authentication uses the central invalid-session event plus a correlated
        unsupported INVALID_SESSION estimate response. Read failures return failed
        NAVIGATION_READ_FAILED; nonfinite arithmetic or positive-distance duration
        underflow to zero returns ESTIMATE_NUMERIC_INVALID. Zero duration is valid
        only for exactly zero distance.
        Exactly one correlated estimate response is emitted per handled request;
        invalid-session is a separate session notification, not an estimate result
        and cannot resolve an estimate request. No transport exactly-once guarantee.
        No position vectors, navigationState, revisions, candidates, ranking, curve,
        fuel or execution are returned. Never update/mix preview positions or epoch
        from this response, or combine independent estimates as one shared snapshot.
        Model IDs identify producers, not freshness. Internal source-change checks
        remain; there is no public cache/revision-token revalidation protocol.
        Candidate evaluation/result caps and assist planning remain later decisions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NavigationRouteEstimateRequest'
            examples:
              distanceOnly:
                value:
                  playerName: PilotOne
                  sessionKey: session-123
                  correlationId: 36ea198f-0df8-4fa9-82b3-7bdfe0d9fd66
                  requestIdentity:
                    operation: navigation-route-estimate
                    entityType: solar-system
                    containerId: sol
                  solarSystemId: sol
                  shipId: owned-ship-id
                  destinationMarketId: sol-pluto-orbit
              hypotheticalDuration:
                summary: Explicit scenario speed, not certified ship capability
                value:
                  playerName: PilotOne
                  sessionKey: session-123
                  correlationId: 36ea198f-0df8-4fa9-82b3-7bdfe0d9fd66
                  requestIdentity:
                    operation: navigation-route-estimate
                    entityType: solar-system
                    containerId: sol
                  solarSystemId: sol
                  shipId: owned-ship-id
                  destinationMarketId: sol-pluto-orbit
                  scenarioCruiseSpeedKmPerSec: 10
      responses:
        '200':
          description: navigation-route-estimate-response; inspect success and estimate.status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NavigationRouteEstimateResponse'
              examples:
                distanceOnly:
                  summary: Synthetic measurement example, not a captured world result
                  value:
                    success: true
                    message: Direct baseline measured; any duration is hypothetical, not an ETA
                    playerName: PilotOne
                    solarSystemId: sol
                    correlationId: 36ea198f-0df8-4fa9-82b3-7bdfe0d9fd66
                    requestIdentity:
                      operation: navigation-route-estimate
                      entityType: solar-system
                      containerId: sol
                    estimate:
                      status: supported
                      solarSystemId: sol
                      departure: { shipId: owned-ship-id }
                      destination: { marketId: sol-pluto-orbit }
                      coordinateBasisId: stellar:sol:catalog-cartesian:v1
                      referenceEpochMs: 1794614400000
                      positionEvaluationModelId: sol-catalog-kepler-position-v1
                      estimationModelId: frozen-endpoints-constant-speed-v1
                      distanceKm: 1000
                      classification: hypothetical-not-eta
                      assumptions:
                        endpointsFrozen: true
                        constantScenarioSpeed: true
                        accelerationBrakingOmitted: true
                        assistSpeedChangesOmitted: true
                        movementDuringTripOmitted: true
                      warnings: [CLEARANCE_UNVERIFIED]
                      duration:
                        status: unavailable
                        reason: SCENARIO_SPEED_NOT_SUPPLIED
                unknownBasis:
                  value:
                    success: false
                    message: The owned ship has no trusted server placement lineage
                    playerName: PilotOne
                    solarSystemId: sol
                    correlationId: 36ea198f-0df8-4fa9-82b3-7bdfe0d9fd66
                    requestIdentity:
                      operation: navigation-route-estimate
                      entityType: solar-system
                      containerId: sol
                    estimate:
                      status: unsupported
                      reason: BASIS_UNKNOWN
                      message: The owned ship has no trusted server placement lineage
  /socket/solar-system-get:
    post:
      summary: solar-system-get-request
      description: |
        Resolves a solar system by id, seeds its canonical celestial bodies on demand,
        and returns both the system summary and its materialized bodies.
        Cygnus X-1 contains separate cygnus-x1-black-hole and cygnus-x1-hd226868
        bodies; HYG 97987 / HIP 98298 / HD 226868 identifies the companion anchor.
        Cygnus positions are authored system-origin seed placements, not measured
        coordinates. No orbital orientation or phase is asserted.
        Positions are persisted seed-time barycentric snapshots at spatial.epochMs,
        not recalculated on each read. Orbital elements retain their reference epoch.
        Optional navigation selects an owned ship, destinationMarketId, and at most
        one candidateBodyId. This read-only branch bypasses seeding and presence
        refresh; asOf does not select its epoch. navigationState evaluates supported
        Sol catalog dependencies and exact bundled station anchors at the verified
        ship position epoch while stars/bodies remain stored snapshots. The ship is
        never propagated or retimestamped. The initial numeric game basis is
        stellar:sol:catalog-cartesian:v1, model sol-catalog-kepler-position-v1.
        Source/ship position epochs must be integer milliseconds in [2000,2100).
        Sources must match the bundled elliptical model and their stored positions
        within 0.001 km Euclidean distance; this is not physical accuracy.
        Comet/custom evaluators and non-Sol systems are unsupported. All selected
        dependencies, including an optional candidate, must pass or the whole
        navigationState is unsupported. Supported new Sol station purchases now
        persist backend-controlled placement lineage after purchase completion.
        The new ship is authored at the evaluated purchase epoch, never copied
        from an old position and retimestamped. This lineage survives restart;
        inventory/economy changes preserve it, spatial/ownership changes revoke it.
        There is no public certification API. Legacy ships and unchanged starter
        creation without trusted lineage return BASIS_UNKNOWN. Legacy orbital
        stations may qualify by exact verified anchor, with null placementKind.
        Metadata-only, Lagrange and deep-space placements are unsupported.
        Motion, clearance and gravityAssist have explicit unsupported status even
        when position comparison is supported. No safe flyby or transfer is claimed.
        previewEligibility is independent of numeric position support:
        ineligible blocks known source/destination station intersections with
        the versioned catalog mean-radius profile (including Earth's station);
        eligible-with-warnings means CLEARANCE_UNVERIFIED, not physical safety.
        Preview routes use exclusively supported navigationState positions at its
        epochMs. Ordinary Viewer body/station meshes and stored positions remain
        unchanged and unsynchronized. Destination and optional candidate must have
        visibly distinct preview-only markers at their evaluated positions, keyed
        by solarSystemId plus marketId/bodyId and labeled as projected at epochMs.
        A route terminates at the projected destination marker, not an ordinary
        station mesh at a different position; any candidate waypoint likewise
        uses its projected marker. This presentation is geometric-only, not a
        gravity-assist trajectory, safety, velocity-compatibility or transfer claim.
        Marker presentation is a consumer contract, not additional response fields;
        see docs/spatial-model.md for the actual local purchase/restart example.
        Optional sibling navigationEstimate requires navigation. Empty options
        request distance only; optional scenarioCruiseSpeedKmPerSec must be positive
        finite and is never ship capability. The opt-in response sibling contains
        success, association: same-response-direct-endpoints, and estimate.
        It is computed from this exact returned navigationState's departure/destination
        vectors with no second evaluation/read. Nested success is independent of
        outer system-lookup success. Supported estimates require supported eligible
        projections; invalid options/numerical failures leave valid preview unchanged.
        Rejections carry reason/message and no distance/duration. SOURCES_CHANGED
        rejects the pair's estimate; read failures return failed NAVIGATION_READ_FAILED.
        Duration remains hypothetical frozen-endpoint constant-speed, never an ETA.
        Zero duration requires exactly zero distance; nonzero-distance underflow fails.
        This is direct coordinate distance, not flown distance or the length/duration
        of a candidate waypoint polyline or illustrative curve.
        Retain/replace the pair together; reject frontend association to any different
        response or different endpoints. Matching IDs, epochs or correlation alone
        cannot associate independently requested estimates. No token or TTL is added.
        The historical pair remains internally associated after world changes, but
        is not a live freshness guarantee. Existing deep-copy/read-hash checks are
        not a transactional cross-collection database snapshot. Standalone estimates
        remain unassociated with preview geometry. Non-opt-in clients receive no
        new response field or behavior. No new candidate planning or UI is included.
        For Copper Vale (exo-gj-9066), a durable approved P6 checkpoint takes precedence
        over ordinary lazy catalog seeding, including after restart. Its full
        augmented canonical baseline is retained; only a normal seed marker may be
        adopted after exact approved-epoch source and seed-owned readback checks.
        Incomplete checkpoints, changed source or seed-owned snapshot mismatches
        return success false with reason CELESTIAL_SEED_FAILED and a review message.
        Neither reads nor internal force catalog refresh silently repair or replace
        approved P6 fields. A source refresh requires separate owner review.
        Valid mutable updatedAt and gameplay changes do not invalidate the baseline.
        Independently journaled additive markets are retained; no baseline reset.
        Applied bulk non-Sol checkpoints also precede ordinary lazy seeding and
        retain both pre-existing catalog snapshot epochs and generated additions.
        An incomplete or drifted bulk checkpoint returns CELESTIAL_SEED_FAILED.
        Internal force refresh is refused without writes. Bulk additions are
        explicitly hypothetical, not detected catalog facts. Deployment requires
        a full-cohort local dry-run and explicit final approval outside this API.
        Separately journaled additive bulk density markets are allowed without
        relaxing baseline body or initial-market verification. Their exact owned
        identities and placements are checked; a missing completed market or
        density identity/placement mismatch returns CELESTIAL_SEED_FAILED.
        Inventory, stock, ledger and ship-sale state remain gameplay-owned.
        Density v2 also verifies exact inspected legacy Alpha/Barnard market
        identities. Existing geometry defects are preserved and disclosed, not
        repaired or certified by additive density; Alpha receives no new markets.
        Each body requires non-null bodyType and compatible surfaceArchetype.
        Per-body spectralClass and luminositySolar include companion stars; unknown
        source data is null. Visualization color is optional and independent.
        physicalCatalog and physical are separate provenance objects; see the shared
        physical schemas and docs/celestial-body-contract.md for units and precedence.
        Reads do not synthesize asteroid catalogs from physical estimates, overwrite
        source catalogs, coerce mission bodyType, or inject visualization defaults.
        Bodies preserve optional catalogIdentity; see the authoritative root
        x-catalog-identity registry, validation, data recreation and fallback rules.
        id remains game identity; only catalogIdentity identifies a real astronomical
        body for a frontend-owned texture catalog. textureKey is not that identity.

        Preconditions:
        - Every request must include a client-generated `correlationId` (UUID v4).
        - Every request must include `requestIdentity` with `operation`, `entityType`, and
          `containerId`.

        Response notes:
        - `solarSystem`, `stars`, and `bodies` are present on success.
        - Celestial body `id` values are durable canonical identity and may seed client-side appearance generation.
        - Every body includes a required `surfaceArchetype`; this is separate from `planetType`.
        - Mission-generated asteroids are normalized into canonical asteroid viewer shape.
        - Failure responses omit `solarSystem`, `stars`, and `bodies`.
        - A successful system lookup does not imply navigation support: inspect navigationState.status.
        - NAVIGATION_READ_FAILED returns success false and an explicit unsupported navigationState.
      operationId: socketSolarSystemGet
      tags: [SolarSystem]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolarSystemGetRequest'
            examples:
              pairedDirectBaseline:
                summary: Exact same-response endpoints; optional hypothetical speed
                value:
                  playerName: PilotOne
                  sessionKey: session-123
                  correlationId: 36ea198f-0df8-4fa9-82b3-7bdfe0d9fd66
                  requestIdentity:
